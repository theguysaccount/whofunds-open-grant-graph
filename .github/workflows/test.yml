name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m unittest discover -s tests -v
      - working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm test
